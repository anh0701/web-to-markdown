<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Web to Markdown</title>

    <link
        rel="stylesheet"
        href="popup.css"
    >
</head>

<body>

    <div class="popup">

        <div class="header">

            <div class="logo">
                MD
            </div>

            <div>

                <h1>
                    Web to Markdown
                </h1>

                <p>
                    Convert web content to Markdown
                </p>

            </div>

        </div>


        <div class="actions">

            <button
                id="convertPage"
                class="action-button primary"
            >

                <span class="icon">
                    <svg
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>

                        <polyline points="14 2 14 8 20 8"/>

                        <line x1="8" y1="13" x2="16" y2="13"/>

                        <line x1="8" y1="17" x2="13" y2="17"/>
                    </svg>
                </span>

                <span class="button-content">

                    <strong>
                        Convert Page
                    </strong>

                    <small>
                        Convert the entire page
                    </small>

                </span>

            </button>


            <button
                id="selectContent"
                class="action-button"
            >

                <span class="icon">
                    <svg
                        viewBox="0 0 24 24"
                        width="22"
                        height="22"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path
                            d="
                                M4 4
                                L20 12
                                L13 14
                                L10 21
                                Z
                            "
                        />
                    </svg>
                </span>

                <span class="button-content">

                    <strong>
                        Select Content
                    </strong>

                    <small>
                        Select text on the page
                    </small>

                </span>

            </button>

        </div>


        <div
            id="resultContainer"
            class="result-container hidden"
        >

            <div class="result-header">

                <span>
                    Markdown Result
                </span>

                <button
                    id="copy"
                    class="copy-button"
                >
                    Copy
                </button>

            </div>


            <textarea
                id="result"
                placeholder="Markdown result..."
            ></textarea>

        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
